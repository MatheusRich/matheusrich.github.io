name: Sync external posts

on:
  # Cron has no way to say "every two weeks", so this runs on the 1st and the
  # 15th, off-peak to make it less likely to be delayed.
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Sync posts from thoughtbot's blog
        run: bundle exec bake sync_external_posts

      - name: Look for new posts
        id: sync
        run: |
          if [ -n "$(git status --porcelain _posts)" ]; then
            echo "new_posts=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new to sync."
          fi

      # Catches a malformed stub before it reaches a pull request. Without
      # `--strict-front-matter` a broken one only logs an error and gets
      # dropped from the build, which would pass unnoticed.
      - name: Build the site
        if: steps.sync.outputs.new_posts
        run: bundle exec jekyll build --strict-front-matter
        env:
          JEKYLL_ENV: production

      - name: Open a pull request
        if: steps.sync.outputs.new_posts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The branch is rebuilt from scratch every run, so an open pull
          # request has to be merged first. Waiting loses nothing: its stubs
          # aren't on main yet, so the next run creates whatever is missing.
          if [ -n "$(gh pr list --head sync-external-posts --state open --json number --jq '.[].number')" ]; then
            echo "A sync pull request is already open; merge it before syncing again."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create sync-external-posts
          git add _posts
          git commit --message "Sync posts from thoughtbot's blog"
          git push --force origin sync-external-posts

          gh pr create \
            --base main \
            --head sync-external-posts \
            --title "Sync posts from thoughtbot's blog" \
            --body "Generated by \`bake sync_external_posts\`. The titles, descriptions and categories are scraped from thoughtbot's HTML, so give them a look before merging. Edits to this branch are safe: the next sync waits while this is open."
